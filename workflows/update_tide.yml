name: 自動更新天氣與潮汐資料

on:
  schedule:
    # 設定為每 15 分鐘執行一次
    - cron: '*/1 * * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼倉庫
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 執行潮汐與紫外線的 Python 腳本
      - name: 執行 Python 腳本
        run: |
          python generate_tide.py
          python generate_uv.py

      # 自動提交並推送變更（若內容有更新才推送）
      - name: 自動提交並推送變更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tide_30days.json uv_data.json
          git diff --staged --quiet || git commit -m "自動每15分鐘更新潮汐與紫外線資料"
          git push
