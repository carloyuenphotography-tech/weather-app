name: 自動更新潮汐預測資料

on:
  # 1. 設定每天自動執行的時間（使用 UTC 時間，這裡設定為香港時間每天早上 8 點執行，即 UTC 0分 0時）
  schedule:
    - cron: '0 0 * * *'
  
  # 2. 允許你手動在 GitHub 網頁上按鈕觸發執行
  workflow_dispatch:

jobs:
  update-tide:
    runs-on: ubuntu-latest
    
    # 授權 GitHub Actions 有權限修改並推送程式碼回倉庫
    permissions:
      contents: write
      
    steps:
      # 1. 下載你的專案程式碼
      - name: 簽出專案碼 (Checkout code)
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

     # 3. 執行 Python 腳本來生成潮汐與紫外線 JSON
      - name: 執行 Python 腳本
        run: |
          python generate_tide.py
          python generate_uv.py

      # 4. 自動把更新後的 JSON 檔案提交並推送到 GitHub 倉庫
      - name: 自動提交並推送變更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tide_30days.json uv_data.json
          git diff --staged --quiet || git commit -m "自動更新未來 30 日潮汐與紫外線資料 (JSON)"
          git push
      # 4. 自動把更新後的 JSON 檔案提交並推送到 GitHub 倉庫
      - name: 自動提交並推送變更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tide_30days.json
          git diff --staged --quiet || git commit -m "自動更新未來 30 日潮汐資料 (JSON)"
          git push
