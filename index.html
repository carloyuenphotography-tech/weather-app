<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的香港天氣即時監控面板</title>
    
    <!-- 內置您的自訂桌面捷徑圖示 -->
    <link rel="icon" type="image/png" href="myweatherapp.png">
    <link rel="apple-touch-icon" href="myweatherapp.png">

    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }
        header { text-align: center; margin-bottom: 15px; }
        header h1 { margin: 0 0 5px 0; color: var(--primary-color); font-size: 1.4rem; }
        header p { margin: 0; color: #64748b; font-size: 0.85rem; }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            box-sizing: border-box;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            width: 100%;
            overflow: hidden;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-header h2 { font-size: 1.1rem; margin: 0; color: #334155; }
        .btn-link {
            font-size: 0.8rem;
            background-color: #e0f2fe;
            color: #0284c7;
            padding: 4px 8px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-link:hover { background-color: #bae6fd; }
        
        .media-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            min-height: 260px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .media-container a {
            width: 100%;
            height: 100%;
            display: block;
        }
        .media-container img, .media-container iframe {
            width: 100%; height: 100%; border: none; object-fit: contain;
            box-sizing: border-box;
        }
        
        .text-content { 
            font-size: 0.9rem; 
            line-height: 1.5; 
            overflow-y: auto; 
            max-height: 300px; 
            padding: 10px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
            word-break: break-word;
        }

        .windy-forecast-container {
            width: 100%;
            min-height: 187px;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .windy-forecast-container iframe {
            width: 100%;
            height: 187px;
            border: none;
            display: block;
        }

        /* 日出日落卡片樣式 */
        .sun-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            box-sizing: border-box;
        }
        .sun-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .sun-box h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: #0369a1;
        }
        .sun-box .time {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0c4a6e;
            margin-bottom: 4px;
        }
        .sun-box .angle {
            font-size: 0.85rem;
            color: #475569;
        }
        .solar-term-info {
            margin-top: 12px;
            padding: 8px 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #334155;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>香港天氣即時監控面板</h1>
        <p id="update-time">頁面載入中...</p>
    </header>

    <div class="dashboard">
        <!-- 1. 隨機天文台天氣照片 (每 2 秒自動更新) -->
        <div class="card">
            <div class="card-header">
                <h2><span id="photo-title">1. 天文台天氣照片</span></h2>
                <a href="photo.html" class="btn-link" target="_blank">查看照片 ↗</a>
            </div>
            <div class="media-container">
                <a id="photo-link" href="https://www.hko.gov.hk/tc/wxinfo/ts/webcam/VPA_photo.htm" target="_blank">
                    <img id="hko-photo" src="https://www.hko.gov.hk/wxinfo/aws/hko_mica/vpa/latest_VPA.jpg" alt="隨機天氣照片">
                </a>
            </div>
        </div>

        <!-- 2. 天氣預測地圖 (衛星) -->
        <div class="card">
            <div class="card-header">
                <h2>衛星雲圖</h2>
                <a href="satellite.html" class="btn-link" target="_blank">全螢幕 ↗</a>
            </div>
            <div class="media-container" style="background: #f1f5f9;">
                <iframe src="https://embed.windy.com/embed2.html?lat=22.300&lon=114.170&zoom=6&level=surface&overlay=satellite&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"></iframe>
            </div>
        </div>

        <!-- 3. Windy 雷達圖 -->
        <div class="card">
            <div class="card-header">
                <h2>雷達圖</h2>
                <a href="satellite.html" class="btn-link" target="_blank">全螢幕 ↗</a>
            </div>
            <div class="media-container" style="background: #f1f5f9;">
                <iframe src="https://embed.windy.com/embed2.html?lat=22.300&lon=114.170&zoom=8&level=surface&overlay=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"></iframe>
            </div>
        </div>

        <!-- 4. 日出日落時間與節氣倒數提示 -->
        <div class="card">
            <div class="card-header">
                <h2>今日日出日落時間與方位</h2>
                <a href="https://www.hko.gov.hk/tc/gts/astron/sunpos.htm" class="btn-link" target="_blank">天文台數據 ↗</a>
            </div>
            <div class="sun-info-grid">
                <div class="sun-box">
                    <h3>🌅 日出 (Sunrise)</h3>
                    <div class="time" id="sunrise-time">計算中...</div>
                    <div class="angle" id="sunrise-angle">方位: --°</div>
                </div>
                <div class="sun-box" style="background: #fff7ed; border-color: #fed7aa;">
                    <h3 style="color: #c2410c;">🌇 日落 (Sunset)</h3>
                    <div class="time" id="sunset-time" style="color: #7c2d12;">計算中...</div>
                    <div class="angle" id="sunset-angle">方位: --°</div>
                </div>
            </div>
            <div class="solar-term-info" id="solar-term-text">
                正在計算距離重要節氣天數...
            </div>
        </div>

        <!-- 5. 天文台本港天氣預測 -->
        <div class="card">
            <div class="card-header">
                <h2>4. 本港天氣預測</h2>
                <a href="https://www.hko.gov.hk/tc/wxinfo/currwx/flw.htm" class="btn-link" target="_blank">原網頁 ↗</a>
            </div>
            <div class="text-content" id="rss-local-forecast">
                正在從天文台載入最新天氣預測...
            </div>
        </div>

        <!-- Windy 詳細天氣預測數據 -->
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-header">
                <h2>Windy 詳細天氣預測數據</h2>
            </div>
            <div class="windy-forecast-container">
                <iframe src="https://embed.windy.com/embed.html?type=forecast&location=coordinates&detail=true&detailLat=22.289084419494117&detailLon=114.17325709226043&metricTemp=default&metricRain=default&metricWind=default" frameborder="0"></iframe>
            </div>
        </div>

        <!-- 6. 天文台九天天氣預報 -->
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-header">
                <h2>5. 天文台九天天氣預報</h2>
                <a href="https://www.hko.gov.hk/tc/wxinfo/currwx/fnd.htm" class="btn-link" target="_blank">原網頁 ↗</a>
            </div>
            <div class="text-content" style="max-height: 350px;" id="rss-9day-forecast">
                正在載入九天天氣預報...
            </div>
        </div>
    </div>

    <script>
        // --- 計算日出日落與節氣倒數 ---
        function calculateSunAndTerms() {
            const now = new Date();
            const year = now.getFullYear();
            const lat = 22.3193;
            const lon = 114.1694;
            const tz = 8;

            const startOfYear = new Date(year, 0, 1);
            const dayOfYear = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24));

            // 1. 日出日落計算
            const declination = 0.409 * Math.sin(2 * Math.PI * (dayOfYear + 284) / 365);
            const latRad = lat * (Math.PI / 180);
            const cosHourAngle = -Math.tan(latRad) * Math.tan(declination);
            
            let hourAngle = 0;
            if (cosHourAngle >= -1 && cosHourAngle <= 1) {
                hourAngle = Math.acos(cosHourAngle) * (180 / Math.PI);
            }

            const solarNoon = 12 + tz - (lon / 15);
            const sunriseHourDecimal = solarNoon - (hourAngle / 15);
            const sunsetHourDecimal = solarNoon + (hourAngle / 15);

            function formatTime(decimal) {
                const h = Math.floor(decimal);
                const m = Math.round((decimal - h) * 60);
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            }

            const sunriseAzimuth = Math.round(90 - (declination * (180 / Math.PI)) * 1.5);
            const sunsetAzimuth = Math.round(270 + (declination * (180 / Math.PI)) * 1.5);

            document.getElementById('sunrise-time').innerText = formatTime(sunriseHourDecimal);
            document.getElementById('sunrise-angle').innerText = `方位: 約 ${sunriseAzimuth}°`;
            document.getElementById('sunset-time').innerText = formatTime(sunsetHourDecimal);
            document.getElementById('sunset-angle').innerText = `方位: 約 ${sunsetAzimuth}°`;

            // 2. 四個重要節氣日期計算 (春分 3/21, 夏至 6/21, 秋分 9/23, 冬至 12/22)
            const terms = [
                { name: "春分", date: new Date(year, 2, 21) },
                { name: "夏至", date: new Date(year, 5, 21) },
                { name: "秋分", date: new Date(year, 8, 23) },
                { name: "冬至", date: new Date(year, 11, 22) }
            ];

            // 找出下一個即將到來的節氣
            let nextTerm = null;
            for (let term of terms) {
                if (now < term.date) {
                    nextTerm = term;
                    break;
                }
            }
            // 如果今年的四個節氣都過了，則是明年的春分
            if (!nextTerm) {
                nextTerm = { name: "春分", date: new Date(year + 1, 2, 21) };
            }

            const diffTime = nextTerm.date - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            document.getElementById('solar-term-text').innerHTML = `🌱 距離下一個重要節氣 <strong>${nextTerm.name}</strong> 還有 <strong>${diffDays}</strong> 天`;
        }

        calculateSunAndTerms();

        // --- 天氣照片陣列與隨機切換 ---
        const weatherPhotos = [
            { name: "太平山 (東面)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/vpa/latest_VPA.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/VPA_photo.htm" },
            { name: "太平山 (東北偏北)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/vpb/latest_VPB.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/VPB_photo.htm" },
            { name: "環球貿易廣場 (東南)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/ic1/latest_IC1.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/IC1_photo.htm" },
            { name: "環球貿易廣場 (西南)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/ic2/latest_IC2.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/IC2_photo.htm" },
            { name: "清水灣 (向東)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/cwb/latest_CWB.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/CWB_photo.htm" },
            { name: "中環 (維港)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/cp1/latest_CP1.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/CP1_photo.htm" },
            { name: "流浮山 (向西)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/lfs/latest_LFS.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/LFS_photo.htm" },
            { name: "大帽山 (東北)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/tm2/latest_TM2.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/TM2_photo.htm" },
            { name: "大帽山 (西北)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/tm3/latest_TM3.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/TM3_photo.htm" },
            { name: "坪洲 (遠眺維港)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/pe2/latest_PE2.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/PE2_photo.htm" },
            { name: "滘西洲 (西北偏西)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/ks2/latest_KS2.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/KS2_photo.htm" },
            { name: "橫瀾島 (西北偏北)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/wgl/latest_WGL.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/WGL_photo.htm" },
            { name: "橫瀾島 (向西)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/wl2/latest_WL2.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/WL2_photo.htm" },
            { name: "南丫島 (西北)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/lam/latest_LAM.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/LAM_photo.htm" },
            { name: "長洲 (向北)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/cs2/latest_CS2.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/CS2_photo.htm" },
            { name: "德瑞國際學校 (海洋公園)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/gsi/latest_GSI.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/GSI_photo.htm" },
            { name: "尖沙咀 (向西)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/hk2/latest_HK2.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/HK2_photo.htm" },
            { name: "大欖涌 (大嶼山北部)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/tlc/latest_TLC.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/TLC_photo.htm" },
            { name: "西貢水警東 (東北)", img: "https://www.hko.gov.hk/wxinfo/aws/hko_mica/skg/latest_SKG.jpg", link: "https://www.hko.gov.hk/tc/wxinfo/ts/webcam/SKG_photo.htm" }
        ];

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('update-time').innerText = `最後更新時間：${now.toLocaleString('zh-HK')}`;
        }
        updateTimestamp();

        function setRandomPhoto() {
            const randomIndex = Math.floor(Math.random() * weatherPhotos.length);
            const selected = weatherPhotos[randomIndex];
            const timestamp = new Date().getTime();

            document.getElementById('photo-title').innerText = selected.name;
            document.getElementById('photo-link').href = selected.link;
            document.getElementById('hko-photo').src = `${selected.img}?t=${timestamp}`;
        }
        setRandomPhoto();

        async function loadRSS(url, elementId) {
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                if (data.contents) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data.contents, 'text/xml');
                    const description = xmlDoc.querySelector('item description');
                    if (description) {
                        document.getElementById(elementId).innerHTML = description.textContent;
                    } else {
                        document.getElementById(elementId).innerText = '暫時無法取得預報內容。';
                    }
                }
            } catch (error) {
                console.error('載入 RSS 失敗:', error);
                document.getElementById(elementId).innerHTML = '載入失敗，請點擊上方按鈕前往天文台原網頁查看。';
            }
        }

        loadRSS('https://rss.weather.gov.hk/rss/LocalWeatherForecast_uc.xml', 'rss-local-forecast');
        loadRSS('https://rss.weather.gov.hk/rss/SeveralDaysWeatherForecast_uc.xml', 'rss-9day-forecast');

        // 天氣照片每 2 秒 (2000 毫秒) 隨機切換一次
        setInterval(() => {
            setRandomPhoto();
            updateTimestamp();
        }, 2000);
    </script>
</body>
</html>
