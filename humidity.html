<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港各區實測溫濕度與氣象分析地圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 550px; }
        .weather-pin {
            position: relative;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: center;
            white-space: nowrap;
        }
        .weather-pin::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #0f172a transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 標題與氣象智慧分析面板 -->
        <div class="bg-white shadow-md rounded-lg p-6 space-y-4">
            <h1 class="text-2xl font-bold text-gray-900">香港各區即時氣象與微氣候分析</h1>
            <p class="text-xs text-gray-500" id="loading-status">正在載入即時氣象大數據...</p>
            
            <!-- 統計卡片格 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <div class="text-xs text-blue-600 font-semibold">全港平均相對濕度</div>
                    <div class="text-2xl font-bold text-blue-900 mt-1" id="stat-avg-humid">--</div>
                </div>
                <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4">
                    <div class="text-xs text-indigo-600 font-semibold">雲海季節指標 (濕度 ≥ 90% / 95%)</div>
                    <div class="text-lg font-bold text-indigo-900 mt-1" id="stat-cloud-sea">評估中...</div>
                </div>
                <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
                    <div class="text-xs text-amber-600 font-semibold">微氣候現象 (輻射冷卻 / 逆溫)</div>
                    <div class="text-sm font-medium text-amber-900 mt-1" id="stat-analysis">分析中...</div>
                </div>
            </div>
        </div>

        <!-- 衛星地圖區域 -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden p-4">
            <h2 class="text-lg font-bold text-gray-900 mb-3">即時衛星溫濕度分佈地圖</h2>
            <div id="map" class="rounded-lg shadow-inner"></div>
        </div>

        <!-- 詳細數據表格 -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-bold text-gray-900">各氣象站實測數據清單</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700 text-sm border-b border-gray-200">
                            <th class="py-3 px-6 font-semibold">氣象站 / 地區</th>
                            <th class="py-3 px-6 font-semibold">氣溫</th>
                            <th class="py-3 px-6 font-semibold">相對濕度</th>
                            <th class="py-3 px-6 font-semibold">數據時間</th>
                        </tr>
                    </thead>
                    <tbody id="weather-tbody" class="divide-y divide-gray-200 text-sm">
                        <tr><td colspan="4" class="py-6 px-6 text-center text-gray-400">正在載入數據...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center text-xs text-gray-500 py-2">
            數據來源：香港天文台 / 空間數據共享入門網站 (CSDI)
        </div>
    </div>

    <script>
        const map = L.map('map').setView([22.3193, 114.1694], 11);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 17,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        async function fetchWeatherData() {
            const statusEl = document.getElementById('loading-status');
            const tbody = document.getElementById('weather-tbody');
            
            const apiUrl = 'https://hko-humidity-api-rcr3.onrender.com/humidity';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('網絡請求失敗');
                
                const result = await response.json();
                const stations = result.stations;
                const stats = result.stats;
                
                if (!Array.isArray(stations) || stations.length === 0) {
                    statusEl.textContent = '未能取得有效的氣象站數據。';
                    return;
                }

                // 填入統計面板數據
                document.getElementById('stat-avg-humid').textContent = `${stats.avg_humidity}%`;
                document.getElementById('stat-cloud-sea').textContent = `${stats.cloud_sea_status} (${stats.count_95}個站≥95%)`;
                
                const analysisText = stats.analysis_notes.length > 0 ? stats.analysis_notes.join(' ') : "目前氣温分佈平穩，未見明顯極端輻射冷卻。";
                document.getElementById('stat-analysis').textContent = analysisText;

                tbody.innerHTML = '';
                let markerCount = 0;

                stations.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="py-3 px-6 font-medium text-gray-900">${item.station}</td>
                        <td class="py-3 px-6 text-red-600 font-semibold">${item.temperature}</td>
                        <td class="py-3 px-6 text-blue-600 font-semibold">${item.humidity}</td>
                        <td class="py-3 px-6 text-gray-500">${item.time}</td>
                    `;
                    tbody.appendChild(tr);

                    if (item.lat && item.lng) {
                        const customIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div class="weather-pin">
                                     <div class="text-[10px] text-gray-300 truncate max-w-[110px]">${item.station}</div>
                                     <div>
                                        <span class="text-red-400">${item.temperature}</span> | 
                                        <span class="text-blue-400">${item.humidity}</span>
                                     </div>
                                   </div>`,
                            iconSize: [110, 42],
                            iconAnchor: [55, 48]
                        });

                        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);
                        
                        marker.bindPopup(`
                            <div style="font-family: sans-serif;">
                                <strong style="font-size: 14px;">${item.station}</strong><br>
                                氣溫：<span style="color: #dc2626; font-weight: bold;">${item.temperature}</span><br>
                                相對濕度：<span style="color: #2563eb; font-weight: bold;">${item.humidity}</span><br>
                                <span style="font-size: 11px; color: #6b7280;">時間：${item.time}</span>
                            </div>
                        `);
                        markerCount++;
                    }
                });

                statusEl.textContent = `成功載入 ${stations.length} 個氣象站數據，已在衛星地圖標註 ${markerCount} 個站點`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = '無法載入地圖數據。';
            }
        }

        fetchWeatherData();
    </script>
</body>
</html>
