<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港實測溫濕度與微氣候分析地圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 650px; }
        .weather-pin {
            position: relative;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: center;
            white-space: nowrap;
        }
        .weather-pin::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #0f172a transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 氣象智慧分析面板 -->
        <div class="bg-white shadow-md rounded-lg p-6 space-y-4">
            <h1 class="text-2xl font-bold text-gray-900">香港微氣候即時監測（雲海、逆溫層與輻射冷卻）</h1>
            <p class="text-xs text-gray-500" id="loading-status">正在載入香港天文台衛星氣象大數據...</p>
            
            <!-- 統計卡片格 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-2">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <div class="text-xs text-blue-600 font-semibold">全港平均濕度</div>
                    <div class="text-2xl font-bold text-blue-900 mt-1" id="stat-avg-humid">--</div>
                </div>
                <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4">
                    <div class="text-xs text-indigo-600 font-semibold">雲海觀賞條件</div>
                    <div class="text-sm font-bold text-indigo-900 mt-1" id="stat-cloud-sea">評估中...</div>
                </div>
                <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
                    <div class="text-xs text-purple-600 font-semibold">逆溫層狀態 (大帽山/大老山vs平地)</div>
                    <div class="text-xs font-bold text-purple-900 mt-1" id="stat-inversion">分析中...</div>
                </div>
                <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
                    <div class="text-xs text-amber-600 font-semibold">內陸輻射冷卻 (打鼓嶺/石崗等)</div>
                    <div class="text-xs font-bold text-amber-900 mt-1" id="stat-cooling">分析中...</div>
                </div>
            </div>
        </div>

        <!-- 衛星地圖區域 -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden p-4">
            <div id="map" class="rounded-lg shadow-inner"></div>
        </div>

        <div class="text-center text-xs text-gray-500 py-2">
            數據來源：香港天文台 / 空間數據共享入門網站 (CSDI) | 衛星圖資：Esri World Imagery
        </div>
    </div>

    <script>
        const map = L.map('map').setView([22.3193, 114.1694], 11);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 17,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        async function fetchWeatherData() {
            const statusEl = document.getElementById('loading-status');
            
            const apiUrl = 'https://hko-humidity-api-rcr3.onrender.com/humidity';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('網絡請求失敗');
                
                const result = await response.json();
                const stations = result.stations;
                const stats = result.stats;
                
                if (!Array.isArray(stations) || stations.length === 0) {
                    statusEl.textContent = '未能取得有效的氣象站數據。';
                    return;
                }

                // 填入智慧分析面板
                document.getElementById('stat-avg-humid').textContent = `${stats.avg_humidity}%`;
                document.getElementById('stat-cloud-sea').textContent = stats.cloud_sea_status;
                document.getElementById('stat-inversion').textContent = stats.inversion_status;
                document.getElementById('stat-cooling').textContent = stats.radiation_cooling;

                let markerCount = 0;

                stations.forEach(item => {
                    if (item.lat && item.lng) {
                        const customIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div class="weather-pin">
                                     <div class="text-[10px] text-gray-300 truncate max-w-[120px]">${item.station}</div>
                                     <div>
                                        <span class="text-red-400">${item.temperature}</span> | 
                                        <span class="text-blue-400">${item.humidity}</span>
                                     </div>
                                   </div>`,
                            iconSize: [120, 42],
                            iconAnchor: [60, 48]
                        });

                        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);
                        
                        marker.bindPopup(`
                            <div style="font-family: sans-serif;">
                                <strong style="font-size: 14px;">${item.station}</strong><br>
                                氣溫：<span style="color: #dc2626; font-weight: bold;">${item.temperature}</span><br>
                                相對濕度：<span style="color: #2563eb; font-weight: bold;">${item.humidity}</span><br>
                                <span style="font-size: 11px; color: #6b7280;">時間：${item.time}</span>
                            </div>
                        `);
                        markerCount++;
                    }
                });

                statusEl.textContent = `成功加載即時大數據，已在衛星地圖標註 ${markerCount} 個氣象站`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = '無法載入地圖數據。';
            }
        }

        fetchWeatherData();
    </script>
</body>
</html>
