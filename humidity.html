<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港各區實測相對濕度</title>
    <!-- 引入 Tailwind CSS 確保排版乾淨專業 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg overflow-hidden">
        <!-- 標題欄 -->
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <h1 class="text-xl font-bold text-gray-900">香港各區實測相對濕度</h1>
            <p class="text-xs text-gray-500 mt-1" id="loading-status">正在連接您的 Render 後端 API...</p>
        </div>

        <!-- 表格區域 -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-700 text-sm border-b border-gray-200">
                        <th class="py-3 px-6 font-semibold">氣象站 / 地區</th>
                        <th class="py-3 px-6 font-semibold">相對濕度</th>
                        <th class="py-3 px-6 font-semibold">數據時間</th>
                    </tr>
                </thead>
                <tbody id="humidity-tbody" class="divide-y divide-gray-200 text-sm">
                    <tr><td colspan="3" class="py-6 px-6 text-center text-gray-400">正在載入數據...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 頁尾來源 -->
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-xs text-gray-500">
            數據來源：香港天文台 / 空間數據共享入門網站 (CSDI) - 透過 Render 後端服務提供
        </div>
    </div>

    <script>
        async function fetchHumidityData() {
            const statusEl = document.getElementById('loading-status');
            const tbody = document.getElementById('humidity-tbody');
            
            // 💡 請將下方引號內的網址替換為您在 Render 上得到的專屬網址，並在後面加上 /humidity
            // 例如：https://hko-humidity-api.onrender.com/humidity
            const apiUrl = 'https://hko-humidity-api-rcr3.onrender.com/humidity';

            // 防呆提示
            if (apiUrl.includes('您的Render網址')) {
                statusEl.textContent = '請先在程式碼中填入您的 Render 後端網址。';
                tbody.innerHTML = `<tr><td colspan="3" class="py-6 px-6 text-center text-amber-600">請設定 API 網址後重新整理頁面</td></tr>`;
                return;
            }

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('無法從後端伺服器獲取數據');
                
                const data = await response.json();
                
                if (!data.features || data.features.length === 0) {
                    statusEl.textContent = '未能取得有效的氣象站數據。';
                    return;
                }

                tbody.innerHTML = '';
                let count = 0;

                // 遍歷後端傳回來的 GeoJSON 站點資料
                data.features.forEach(feature => {
                    const props = feature.properties;
                    
                    // 自動適應 CSDI 的不同欄位名稱大小寫
                    const stationName = props.EN_NAME || props.STATION_NAME || props.name || props.site || '未知站點';
                    const humidityVal = props.HUMIDITY !== undefined ? `${props.HUMIDITY}%` : (props.value !== undefined ? `${props.value}%` : '資料未明');
                    const timeVal = props.DATETIME || props.time || '即時';

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="py-3 px-6 font-medium text-gray-900">${stationName}</td>
                        <td class="py-3 px-6 text-blue-600 font-semibold">${humidityVal}</td>
                        <td class="py-3 px-6 text-gray-500">${timeVal}</td>
                    `;
                    tbody.appendChild(tr);
                    count++;
                });

                statusEl.textContent = `成功載入 ${count} 個氣象站的實時相對濕度數據`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = '無法連接到 Render 後端伺服器。';
                tbody.innerHTML = `<tr><td colspan="3" class="py-6 px-6 text-center text-red-500">連線失敗，請檢查 Render 服務是否正在運行或網址是否正確。</td></tr>`;
            }
        }

        // 頁面載入時執行
        fetchHumidityData();
    </script>
</body>
</html>
