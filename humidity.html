<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港微氣候即時監測地圖</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Leaflet 地圖 CSS 與 JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* 響應式地圖高度：手機上 420px，電腦螢幕上 620px */
        #map { height: 420px; width: 100%; }
        @media (min-width: 768px) {
            #map { height: 620px; }
        }

        /* 💡 藍色呼吸燈動畫（雲海條件達成時觸發） */
        @keyframes breathing-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); border-color: #3b82f6; }
            50% { box-shadow: 0 0 16px 4px rgba(59, 130, 246, 0.65); border-color: #60a5fa; }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); border-color: #3b82f6; }
        }
        .breathing-blue {
            animation: breathing-blue 2s infinite ease-in-out;
        }

        /* 💡 紫色呼吸燈動畫（探測到逆溫層時觸發） */
        @keyframes breathing-purple {
            0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); border-color: #a855f7; }
            50% { box-shadow: 0 0 16px 4px rgba(168, 85, 247, 0.65); border-color: #c084fc; }
            100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); border-color: #a855f7; }
        }
        .breathing-purple {
            animation: breathing-purple 2s infinite ease-in-out;
        }

        /* 地圖上的浮動氣象針標設計 */
        .weather-pin {
            position: relative;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: center;
            white-space: nowrap;
        }
        .weather-pin::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #0f172a transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- 主容器 -->
    <div class="max-w-6xl mx-auto p-3 sm:p-4 md:p-8 space-y-3 sm:space-y-4">
        
        <!-- 頂部智慧分析面板 -->
        <div class="bg-white shadow-md rounded-xl p-3 sm:p-5 space-y-3 border border-slate-200">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-1 border-b border-slate-100">
                <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">香港微氣候即時監測</h1>
                <p class="text-[11px] text-slate-400 mt-0.5 sm:mt-0" id="loading-status">連接後端載入中...</p>
            </div>
            
            <!-- 指標卡片格 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-4">
                
                <!-- 1. 全港濕度與雲海卡片（符合條件時會發出藍色呼吸燈） -->
                <div id="cloud-sea-card" class="bg-blue-50/70 border border-blue-200 rounded-lg p-2.5 sm:p-3 shadow-sm transition-all duration-500">
                    <div class="text-[11px] text-blue-600 font-semibold">全港平均濕度</div>
                    <div class="text-base sm:text-lg font-bold text-blue-900 mt-0.5" id="stat-avg-humid">--</div>
                    <div class="text-[10px] sm:text-[11px] text-blue-700 mt-0.5 truncate" id="stat-cloud-sea">評估中...</div>
                </div>

                <!-- 2. 高地溫差卡片（當出現逆溫時會發出紫色呼吸燈） -->
                <div id="inversion-card" class="bg-purple-50/70 border border-purple-200 rounded-lg p-2.5 sm:p-3 shadow-sm transition-all duration-500">
                    <div class="text-[11px] text-purple-600 font-semibold">高地溫差 (vs 平地)</div>
                    <div class="flex justify-between items-center mt-1 text-xs sm:text-sm font-bold text-purple-900">
                        <span>大帽山: <span id="stat-tms" class="text-purple-700">--</span></span>
                        <span>大老山: <span id="stat-tc" class="text-indigo-700">--</span></span>
                    </div>
                    <div class="text-[10px] text-purple-700 mt-1 truncate" id="stat-inversion">逆溫分析中...</div>
                </div>

                <!-- 3. 內陸輻射冷卻卡片 -->
                <div class="bg-amber-50/70 border border-amber-200 rounded-lg p-2.5 sm:p-3 shadow-sm">
                    <div class="text-[11px] text-amber-600 font-semibold">內陸輻射冷卻</div>
                    <div class="text-xs sm:text-sm font-bold text-amber-900 mt-1.5 truncate" id="stat-cooling">分析中...</div>
                </div>

            </div>
        </div>

        <!-- 衛星地圖區域 -->
        <div class="bg-white shadow-md rounded-xl overflow-hidden p-2 sm:p-3 border border-slate-200">
            <div id="map" class="rounded-lg shadow-inner z-0"></div>
        </div>

        <!-- 頁尾聲明 -->
        <div class="text-center text-[11px] text-slate-400 py-1">
            數據來源：香港天文台 / 空間數據共享入門網站 (CSDI)
        </div>
    </div>

    <script>
        const map = L.map('map').setView([22.3193, 114.1694], 11);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 17,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        async function fetchWeatherData() {
            const statusEl = document.getElementById('loading-status');
            const apiUrl = 'https://hko-humidity-api-rcr3.onrender.com/humidity';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('網絡請求失敗');
                
                const result = await response.json();
                const stations = result.stations || [];
                const stats = result.stats || {};
                
                if (stations.length === 0) {
                    statusEl.textContent = '暫無氣象站數據。';
                    return;
                }

                // 填入文字數據
                document.getElementById('stat-avg-humid').textContent = `${stats.avg_humidity || 0}% (${stats.count_95 || 0}站≥95%)`;
                document.getElementById('stat-cloud-sea').textContent = stats.cloud_sea_status || '未知';
                document.getElementById('stat-tms').textContent = stats.tms_diff || '資料未明';
                document.getElementById('stat-tc').textContent = stats.tc_diff || '資料未明';
                document.getElementById('stat-inversion').textContent = stats.inversion_status || '未知';
                document.getElementById('stat-cooling').textContent = stats.radiation_cooling || '未知';

                // 💡 智慧呼吸燈觸發邏輯
                const cloudCard = document.getElementById('cloud-sea-card');
                const inversionCard = document.getElementById('inversion-card');

                // 條件 A：若雲海狀態為「極佳」或「良好」，觸發藍色呼吸燈
                if (stats.cloud_sea_status && (stats.cloud_sea_status.includes('極佳') || stats.cloud_sea_status.includes('良好'))) {
                    cloudCard.classList.add('breathing-blue');
                } else {
                    cloudCard.classList.remove('breathing-blue');
                }

                // 條件 B：若探測到逆溫現象（包含 ⚠️ 符號），觸發紫色呼吸燈
                if (stats.inversion_status && stats.inversion_status.includes('⚠️')) {
                    inversionCard.classList.add('breathing-purple');
                } else {
                    inversionCard.classList.remove('breathing-purple');
                }

                let markerCount = 0;

                stations.forEach(item => {
                    if (item.lat && item.lng) {
                        const customIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div class="weather-pin">
                                     <div class="text-[10px] text-slate-300 truncate max-w-[110px]">${item.station}</div>
                                     <div>
                                        <span class="text-red-400">${item.temperature}</span> | 
                                        <span class="text-blue-400">${item.humidity}</span>
                                     </div>
                                   </div>`,
                            iconSize: [110, 40],
                            iconAnchor: [55, 46]
                        });

                        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);
                        
                        marker.bindPopup(`
                            <div style="font-family: sans-serif;">
                                <strong style="font-size: 14px;">${item.station}</strong><br>
                                氣溫：<span style="color: #dc2626; font-weight: bold;">${item.temperature}</span><br>
                                相對濕度：<span style="color: #2563eb; font-weight: bold;">${item.humidity}</span><br>
                                <span style="font-size: 11px; color: #6b7280;">時間：${item.time}</span>
                            </div>
                        `);
                        markerCount++;
                    }
                });

                statusEl.textContent = `已標註 ${markerCount} 個氣象站`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = '無法載入地圖數據。';
            }
        }

        fetchWeatherData();
    </script>
</body>
</html>
