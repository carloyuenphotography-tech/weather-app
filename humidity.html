<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港各區實測相對濕度</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg overflow-hidden">
        <!-- 標題欄 -->
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <h1 class="text-xl font-bold text-gray-900">香港各區實測相對濕度</h1>
            <p class="text-xs text-gray-500 mt-1" id="loading-status">正在載入各區實時相對濕度...</p>
        </div>

        <!-- 表格區域 -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-700 text-sm border-b border-gray-200">
                        <th class="py-3 px-6 font-semibold">氣象站 / 地區</th>
                        <th class="py-3 px-6 font-semibold">相對濕度</th>
                        <th class="py-3 px-6 font-semibold">數據時間</th>
                    </tr>
                </thead>
                <tbody id="humidity-tbody" class="divide-y divide-gray-200 text-sm">
                    <tr><td colspan="3" class="py-6 px-6 text-center text-gray-400">正在連接伺服器獲取數據...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 頁尾來源 -->
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-xs text-gray-500">
            數據來源：香港天文台 / 空間數據共享入門網站 (CSDI)
        </div>
    </div>

    <script>
        async function fetchHumidityData() {
            const statusEl = document.getElementById('loading-status');
            const tbody = document.getElementById('humidity-tbody');
            
            const apiUrl = 'https://hko-humidity-api-rcr3.onrender.com/humidity';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('網絡請求失敗');
                
                const stations = await response.json();
                
                if (!Array.isArray(stations) || stations.length === 0) {
                    statusEl.textContent = '未能取得有效的氣象站數據。';
                    return;
                }

                tbody.innerHTML = '';

                // 直接把後端整理好的乾淨清單渲染到表格上
                stations.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="py-3 px-6 font-medium text-gray-900">${item.station}</td>
                        <td class="py-3 px-6 text-blue-600 font-semibold">${item.humidity}</td>
                        <td class="py-3 px-6 text-gray-500">${item.time}</td>
                    `;
                    tbody.appendChild(tr);
                });

                statusEl.textContent = `成功載入 ${stations.length} 個氣象站的實時相對濕度數據`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = '無法載入數據。';
                tbody.innerHTML = `<tr><td colspan="3" class="py-6 px-6 text-center text-red-500">發生錯誤：${error.message}</td></tr>`;
            }
        }

        fetchHumidityData();
    </script>
</body>
</html>
