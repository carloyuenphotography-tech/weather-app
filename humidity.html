<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港各區實測相對濕度地圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Leaflet 地圖 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 引入 Leaflet 地圖 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 450px; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 地圖卡片區域 -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden p-4">
            <h1 class="text-xl font-bold text-gray-900 mb-2">香港各區實測相對濕度地圖</h1>
            <p class="text-xs text-gray-500 mb-4" id="loading-status">正在載入地圖與實時數據...</p>
            <!-- 地圖容器 -->
            <div id="map" class="rounded-lg shadow-inner"></div>
        </div>

        <!-- 表格區域 -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-bold text-gray-900">氣象站數據列表</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700 text-sm border-b border-gray-200">
                            <th class="py-3 px-6 font-semibold">氣象站 / 地區</th>
                            <th class="py-3 px-6 font-semibold">相對濕度</th>
                            <th class="py-3 px-6 font-semibold">數據時間</th>
                        </tr>
                    </thead>
                    <tbody id="humidity-tbody" class="divide-y divide-gray-200 text-sm">
                        <tr><td colspan="3" class="py-6 px-6 text-center text-gray-400">正在載入數據...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 頁尾來源 -->
        <div class="text-center text-xs text-gray-500 py-2">
            數據來源：香港天文台 / 空間數據共享入門網站 (CSDI)
        </div>
    </div>

    <script>
        // 初始化地圖，中心點設在香港，縮放級別 11
        const map = L.map('map').setView([22.3193, 114.1694], 11);

        // 加入免費的 OpenStreetMap 圖資
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap 貢獻者'
        }).addTo(map);

        async function fetchHumidityData() {
            const statusEl = document.getElementById('loading-status');
            const tbody = document.getElementById('humidity-tbody');
            
            const apiUrl = 'https://hko-humidity-api-rcr3.onrender.com/humidity';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('網絡請求失敗');
                
                const stations = await response.json();
                
                if (!Array.isArray(stations) || stations.length === 0) {
                    statusEl.textContent = '未能取得有效的氣象站數據。';
                    return;
                }

                tbody.innerHTML = '';
                let markerCount = 0;

                stations.forEach(item => {
                    // 1. 填入表格
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="py-3 px-6 font-medium text-gray-900">${item.station}</td>
                        <td class="py-3 px-6 text-blue-600 font-semibold">${item.humidity}</td>
                        <td class="py-3 px-6 text-gray-500">${item.time}</td>
                    `;
                    tbody.appendChild(tr);

                    // 2. 如果有經緯度，在地圖上加入標記 (Marker)
                    if (item.lat && item.lng) {
                        const marker = L.marker([item.lat, item.lng]).addTo(map);
                        
                        // 點擊標記時彈出視窗顯示詳情
                        marker.bindPopup(`
                            <div style="font-family: sans-serif;">
                                <strong style="font-size: 14px;">${item.station}</strong><br>
                                相對濕度：<span style="color: #2563eb; font-weight: bold;">${item.humidity}</span><br>
                                <span style="font-size: 11px; color: #6b7280;">時間：${item.time}</span>
                            </div>
                        `);
                        markerCount++;
                    }
                });

                statusEl.textContent = `成功載入 ${stations.length} 個站點，已在圖上標註 ${markerCount} 個氣象站`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = '無法載入地圖數據。';
            }
        }

        fetchHumidityData();
    </script>
</body>
</html>
