<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港微氣候即時監測地圖</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Leaflet 地圖 CSS 與 JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* 響應式地圖高度：手機上 400px，電腦螢幕上 650px */
        #map { height: 400px; width: 100%; }
        @media (min-width: 768px) {
            #map { height: 650px; }
        }

        /* 地圖上的浮動氣象針標設計 */
        .weather-pin {
            position: relative;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: center;
            white-space: nowrap;
        }
        .weather-pin::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #0f172a transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- 主容器：適應手機與電腦的上下左右留白 -->
    <div class="max-w-6xl mx-auto p-3 sm:p-4 md:p-8 space-y-4 md:space-y-6">
        
        <!-- 頂部標題與氣象智慧分析面板 -->
        <div class="bg-white shadow-lg rounded-xl p-4 sm:p-6 space-y-4 border border-slate-200">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">香港微氣候即時監測</h1>
                <p class="text-xs text-slate-500 mt-1" id="loading-status">正在連接後端伺服器載入數據...</p>
            </div>
            
            <!-- 統計卡片格：手機上預設 2 欄，平板/電腦 4 欄 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 pt-1">
                <!-- 濕度與雲海 -->
                <div class="bg-blue-50/70 border border-blue-200 rounded-lg p-3 sm:p-4 shadow-sm">
                    <div class="text-[11px] sm:text-xs text-blue-600 font-semibold truncate">全港平均濕度 (≥95%站數)</div>
                    <div class="text-lg sm:text-xl font-bold text-blue-900 mt-1" id="stat-avg-humid">--</div>
                    <div class="text-[11px] text-blue-700 mt-1 truncate" id="stat-cloud-sea">評估中...</div>
                </div>
                <!-- 逆溫層：大帽山溫差 -->
                <div class="bg-purple-50/70 border border-purple-200 rounded-lg p-3 sm:p-4 shadow-sm">
                    <div class="text-[11px] sm:text-xs text-purple-600 font-semibold truncate">大帽山 vs 平地溫差</div>
                    <div class="text-base sm:text-lg font-bold text-purple-900 mt-1" id="stat-tms">--</div>
                    <div class="text-[10px] sm:text-[11px] text-purple-700 mt-1 truncate" id="stat-inversion">分析中...</div>
                </div>
                <!-- 逆溫層：大老山溫差 -->
                <div class="bg-indigo-50/70 border border-indigo-200 rounded-lg p-3 sm:p-4 shadow-sm">
                    <div class="text-[11px] sm:text-xs text-indigo-600 font-semibold truncate">大老山 vs 平地溫差</div>
                    <div class="text-base sm:text-lg font-bold text-indigo-900 mt-1" id="stat-tc">--</div>
                    <div class="text-[10px] sm:text-[11px] text-indigo-700 mt-1 truncate">高地氣象對比</div>
                </div>
                <!-- 輻射冷卻 -->
                <div class="bg-amber-50/70 border border-amber-200 rounded-lg p-3 sm:p-4 shadow-sm col-span-2 md:col-span-1">
                    <div class="text-[11px] sm:text-xs text-amber-600 font-semibold truncate">內陸輻射冷卻</div>
                    <div class="text-xs sm:text-sm font-bold text-amber-900 mt-2" id="stat-cooling">分析中...</div>
                </div>
            </div>
        </div>

        <!-- 衛星地圖區域 -->
        <div class="bg-white shadow-lg rounded-xl overflow-hidden p-3 sm:p-4 border border-slate-200">
            <div id="map" class="rounded-lg shadow-inner z-0"></div>
        </div>

        <!-- 頁尾聲明 -->
        <div class="text-center text-xs text-slate-400 py-2">
            數據來源：香港天文台 / 空間數據共享入門網站 (CSDI)
        </div>
    </div>

    <script>
        // 初始化地圖，手機版適度調整縮放中心與級別
        const map = L.map('map').setView([22.3193, 114.1694], 11);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 17,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        async function fetchWeatherData() {
            const statusEl = document.getElementById('loading-status');
            const apiUrl = 'https://hko-humidity-api-rcr3.onrender.com/humidity';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('網絡請求失敗');
                
                const result = await response.json();
                const stations = result.stations || [];
                const stats = result.stats || {};
                
                if (stations.length === 0) {
                    statusEl.textContent = '暫無氣象站數據。';
                    return;
                }

                // 填入分析面板
                document.getElementById('stat-avg-humid').textContent = `${stats.avg_humidity || 0}% (${stats.count_95 || 0}站≥95%)`;
                document.getElementById('stat-cloud-sea').textContent = stats.cloud_sea_status || '未知';
                document.getElementById('stat-tms').textContent = stats.tms_diff || '資料未明';
                document.getElementById('stat-tc').textContent = stats.tc_diff || '資料未明';
                document.getElementById('stat-inversion').textContent = stats.inversion_status || '未知';
                document.getElementById('stat-cooling').textContent = stats.radiation_cooling || '未知';

                let markerCount = 0;

                stations.forEach(item => {
                    if (item.lat && item.lng) {
                        const customIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div class="weather-pin">
                                     <div class="text-[10px] text-slate-300 truncate max-w-[110px]">${item.station}</div>
                                     <div>
                                        <span class="text-red-400">${item.temperature}</span> | 
                                        <span class="text-blue-400">${item.humidity}</span>
                                     </div>
                                   </div>`,
                            iconSize: [110, 40],
                            iconAnchor: [55, 46]
                        });

                        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);
                        
                        marker.bindPopup(`
                            <div style="font-family: sans-serif;">
                                <strong style="font-size: 14px;">${item.station}</strong><br>
                                氣溫：<span style="color: #dc2626; font-weight: bold;">${item.temperature}</span><br>
                                相對濕度：<span style="color: #2563eb; font-weight: bold;">${item.humidity}</span><br>
                                <span style="font-size: 11px; color: #6b7280;">時間：${item.time}</span>
                            </div>
                        `);
                        markerCount++;
                    }
                });

                statusEl.textContent = `成功載入數據，已在衛星地圖標註 ${markerCount} 個氣象站`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = '無法載入地圖數據，請檢查 Render 伺服器狀態。';
            }
        }

        fetchWeatherData();
    </script>
</body>
</html>
