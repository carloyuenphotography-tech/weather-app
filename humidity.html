<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港各區實測相對濕度</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg overflow-hidden">
        <!-- 標題欄 -->
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <h1 class="text-xl font-bold text-gray-900">香港各區實測相對濕度</h1>
            <p class="text-xs text-gray-500 mt-1" id="loading-status">正在載入 CSDI 氣象站實時相對濕度數據...</p>
        </div>

        <!-- 表格區域 -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-700 text-sm border-b border-gray-200">
                        <th class="py-3 px-6 font-semibold">氣象站 / 地區</th>
                        <th class="py-3 px-6 font-semibold">相對濕度</th>
                        <th class="py-3 px-6 font-semibold">數據時間</th>
                    </tr>
                </thead>
                <tbody id="humidity-tbody" class="divide-y divide-gray-200 text-sm">
                    <!-- 數據將由 JavaScript 動態填入 -->
                </tbody>
            </table>
        </div>

        <!-- 頁尾來源 -->
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-xs text-gray-500">
            數據來源：香港天文台 / 空間數據共享入門網站 (CSDI) - latest_1min_humidity
        </div>
    </div>

    <script>
        async function fetchHumidityData() {
            const statusEl = document.getElementById('loading-status');
            const tbody = document.getElementById('humidity-tbody');
            
            // 提示：請將下方網址替換為您在 CSDI 該圖層取得的 ArcGIS REST 查詢網址（結尾加上 &f=geojson）
            // 例如：https://portal.csdi.gov.hk/server/rest/services/.../MapServer/0/query?where=1%3D1&outFields=*&f=geojson
            const csdiGeoJsonUrl = 'https://static.csdi.gov.hk/csdi-webpage/download/04db0982a43f561db9e922cd082b09f9/geojson';

            // 若您尚未填入真實網址，此處先以提示代替
            if (csdiGeoJsonUrl.includes('請在此填入')) {
                statusEl.textContent = '請先在程式碼中填入 CSDI 該圖層的 GeoJSON API 網址。';
                tbody.innerHTML = `<tr><td colspan="3" class="py-6 px-6 text-center text-gray-400">請設定 API 網址以載入數據</td></tr>`;
                return;
            }

            try {
                const response = await fetch(csdiGeoJsonUrl);
                if (!response.ok) throw new Error('網絡請求失敗');
                
                const data = await response.json();
                
                if (!data.features || data.features.length === 0) {
                    statusEl.textContent = '未能取得有效的氣象站數據。';
                    return;
                }

                tbody.innerHTML = '';
                let count = 0;

                // 遍歷每一個站點的特徵 (features)
                data.features.forEach(feature => {
                    const props = feature.properties;
                    
                    // 根據 CSDI 實際欄位名稱調整（通常包含 station_name / name 及 humidity / value）
                    const stationName = props.EN_NAME || props.STATION_NAME || props.name || '未知站點';
                    const humidityVal = props.HUMIDITY !== undefined ? `${props.HUMIDITY}%` : (props.value !== undefined ? `${props.value}%` : '-');
                    const timeVal = props.DATETIME || props.time || new Date().toLocaleString();

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="py-3 px-6 font-medium text-gray-900">${stationName}</td>
                        <td class="py-3 px-6 text-blue-600 font-semibold">${humidityVal}</td>
                        <td class="py-3 px-6 text-gray-500">${timeVal}</td>
                    `;
                    tbody.appendChild(tr);
                    count++;
                });

                statusEl.textContent = `成功載入 ${count} 個氣象站的實時相對濕度數據`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = '無法載入數據，可能是因為 CORS 跨域限制或網址錯誤。';
            }
        }

        // 頁面載入時執行
        fetchHumidityData();
    </script>
</body>
</html>
