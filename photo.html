        function initCategoryDropdown() {
            const selectEl = document.getElementById('categorySelect');
            let categories = [...new Set(allPhotos.map(p => p.category))];
            
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                selectEl.appendChild(opt);
            });
        }

        function renderPhotos(photosToRender, groupByCategory = false) {
            const container = document.getElementById('photoGridContainer');
            container.innerHTML = '';

            if (photosToRender.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #64748b;">此分類暫無相片。</p>`;
                return;
            }

            if (groupByCategory) {
                const categories = [...new Set(photosToRender.map(p => p.category))];
                
                categories.forEach(cat => {
                    const titleEl = document.createElement('div');
                    titleEl.className = 'section-title';
                    titleEl.innerText = `📍 ${cat}地區`;
                    container.appendChild(titleEl);

                    const gridEl = document.createElement('div');
                    gridEl.className = 'photo-grid';

                    const groupPhotos = photosToRender.filter(p => p.category === cat);
                    groupPhotos.forEach(photo => {
                        gridEl.appendChild(createPhotoCard(photo));
                    });

                    container.appendChild(gridEl);
                });
            } else {
                const gridEl = document.createElement('div');
                gridEl.className = 'photo-grid';
                photosToRender.forEach(photo => {
                    gridEl.appendChild(createPhotoCard(photo));
                });
                container.appendChild(gridEl);
            }
        }

        function createPhotoCard(photo) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <div class="photo-card-header">
                    <h3>${photo.name}</h3>
                    <a href="${photo.link}" class="btn-link" target="_blank">原網 ↗</a>
                </div>
                <div class="media-container">
                    <img src="${photo.img}?t=${Date.now()}" alt="${photo.name}" loading="lazy">
                </div>
            `;
            return card;
        }

        function filterPhotos() {
            const selectedCat = document.getElementById('categorySelect').value;
            if (selectedCat === 'all') {
                renderPhotos(allPhotos, true);
            } else {
                const filtered = allPhotos.filter(p => p.category === selectedCat);
                renderPhotos(filtered, false);
            }
        }

        function updateTimestamp() {
            document.getElementById('update-time').innerText = `最後更新時間：${new Date().toLocaleString('zh-HK', { hour12: false }).replace(/\//g, '-')}`;
        }

        initCategoryDropdown();
        renderPhotos(allPhotos, true);
        updateTimestamp();
        setInterval(updateTimestamp, 1000);
    </script>
</body>
</html>
