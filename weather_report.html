<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天文台即時天氣報告</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #e2e8f0;      
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header { 
            text-align: center; 
            margin-bottom: 20px; 
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }
        header h1 { margin: 0 0 10px 0; color: var(--primary-color); font-size: 1.5rem; }
        .back-btn {
            display: inline-block;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #0284c7;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 10px;
        }
        .back-btn:hover { background-color: #e0f2fe; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }
        .report-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            border: 1px solid #cbd5e1;
            padding: 20px;
            margin-bottom: 15px;
        }
        .report-title {
            font-size: 1.2rem;
            color: #0369a1;
            margin-top: 0;
            margin-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .report-date {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 12px;
        }
        .report-desc {
            font-size: 1.0rem;
            line-height: 1.6;
            color: #334155;
        }
        footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="channel-title">香港天文台即時天氣報告</h1>
        <div id="update-info" style="font-size: 0.9rem; color: #64748b;">載入中...</div>
        <a href="index.html" class="back-btn">⬅ 返回主面板</a>
    </header>

    <div class="container" id="reports-container">
        <p style="text-align: center; color: #64748b;">正在載入天氣報告...</p>
    </div>

    <footer>
        資料來源：香港天文台 RSS 服務
    </footer>

    <script>
        async function fetchRssReport() {
            const container = document.getElementById('reports-container');
            const titleEl = document.getElementById('channel-title');
            const infoEl = document.getElementById('update-info');

            try {
                const res = await fetch('rss_data.json');
                if (!res.ok) throw new Error('無法讀取 rss_data.json');
                
                const data = await res.json();
                titleEl.innerText = data.channelTitle || "香港天文台即時天氣報告";
                infoEl.innerText = `JSON 更新時間: ${data.updateTime}`;

                if (data.items && data.items.length > 0) {
                    container.innerHTML = '';
                    data.items.forEach(item => {
                        container.innerHTML += `
                            <div class="report-card">
                                <div class="report-title">${item.title}</div>
                                <div class="report-date">📅 發布時間: ${item.pubDate}</div>
                                <div class="report-desc">${item.description}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<p style="text-align: center;">暫無天氣報告資料。</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p style="text-align: center; color: red;">無法載入天氣報告 (請確認是否已執行 generate_rss.py)</p>`;
            }
        }

        fetchRssReport();
    </script>
</body>
</html>
